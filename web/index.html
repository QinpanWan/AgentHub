<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentHub · 跨 Agent 管理平台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">AH</div>
      <div class="brand-text"><b>AgentHub</b><span>鸿蒙 PC · 跨 Agent 管理</span></div>
    </div>
    <nav class="nav">
      <a href="#/overview" data-view="overview" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg>
        <span class="nav-label">概览</span>
      </a>
      <a href="#/console" data-view="console">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5-5-5"/><path d="M12 19h8"/></svg>
        <span class="nav-label">任务控制台</span>
      </a>
      <a href="#/agents" data-view="agents">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="18" r="2.4"/><path d="M12 7.5v4M10.2 15.8L6.6 17.6M13.8 15.8l3.6 1.8"/></svg>
        <span class="nav-label">Agent 管理</span>
      </a>
      <a href="#/monitor" data-view="monitor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-7 4 14 2.5-7h5"/></svg>
        <span class="nav-label">运行监控</span>
      </a>
      <a href="#/logs" data-view="logs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1.1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.1" fill="currentColor" stroke="none"/></svg>
        <span class="nav-label">日志与报错</span>
      </a>
      <a href="#/plugins" data-view="plugins">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM14 15h3v3h-3z"/></svg>
        <span class="nav-label">插件与技能</span>
      </a>
      <a href="#/workspaces" data-view="workspaces">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
        <span class="nav-label">工作区</span>
      </a>
      <a href="#/memory" data-view="memory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.7"/><path d="M4.5 5.5v6c0 1.5 3.4 2.7 7.5 2.7s7.5-1.2 7.5-2.7v-6"/><path d="M4.5 11.5v6c0 1.5 3.4 2.7 7.5 2.7s7.5-1.2 7.5-2.7v-6"/></svg>
        <span class="nav-label">共享记忆</span>
      </a>
      <a href="#/settings" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h13M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="19" cy="18" r="2"/></svg>
        <span class="nav-label">设置</span>
      </a>
    </nav>
    <div class="side-foot">
      <div class="foot-line">HiShell 部署启动</div>
      <code class="foot-code">./hish start</code>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="page-title">概览</h1>
      <div class="top-right">
        <span id="dsh-chip" class="chip chip-dim" title="dsh Web 服务(3080)">dsh 服务 · …</span>
        <span class="chip" id="chip-cpu">CPU --</span>
        <span class="chip" id="chip-mem">MEM --</span>
        <span class="chip chip-mono" id="chip-clock">--:--:--</span>
      </div>
    </header>
    <section class="content">
      <div id="view-overview" class="view"></div>
      <div id="view-console" class="view hidden"></div>
      <div id="view-agents" class="view hidden"></div>
      <div id="view-monitor" class="view hidden"></div>
      <div id="view-logs" class="view hidden"></div>
      <div id="view-plugins" class="view hidden"></div>
      <div id="view-workspaces" class="view hidden"></div>
      <div id="view-memory" class="view hidden"></div>
      <div id="view-settings" class="view hidden"></div>
    </section>
  </main>
</div>

<div id="toast-root"></div>
<div id="modal-root" class="hidden"></div>
<script src="/app.js"></script>
</body>
</html>
